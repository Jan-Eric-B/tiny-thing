[package]
name = "tray-core"
description = "The Tray core: all logic of the Tray app, with no UI and no platform code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync"] }
tracing.workspace = true

[dev-dependencies]
clap.workspace = true
device-daemon.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tracing-subscriber.workspace = true

[[example]]
name = "fake-now-playing"
path = "examples/fake_now_playing.rs"

[lints]
workspace = true
